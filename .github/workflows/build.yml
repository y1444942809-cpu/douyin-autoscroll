name: Build DouyinAutoScroll dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -fobjc-arc -fobjc-runtime=ios-15.0 -fPIC -dynamiclib -framework Foundation -framework UIKit -framework AVFoundation -framework QuartzCore -o DouyinAutoScroll.dylib DouyinAutoScroll.m
          codesign -s - --force DouyinAutoScroll.dylib
          file DouyinAutoScroll.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinAutoScroll-dylib
          path: DouyinAutoScroll.dylib
