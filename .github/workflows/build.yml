name: Build DouyinAutoScroll dylib
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show iOS SDK
        run: |
          xcrun --sdk iphoneos --show-sdk-version
          echo "SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build dylib
        run: |
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -fobjc-arc -fobjc-runtime=ios-15.0 -fPIC -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation -framework QuartzCore \
            -o DouyinAutoScroll.dylib DouyinAutoScroll.m
          codesign -s - --force DouyinAutoScroll.dylib
          file DouyinAutoScroll.dylib
          ls -lh DouyinAutoScroll.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinAutoScroll-dylib
          path: DouyinAutoScroll.dylib
          if-no-files-found: error
